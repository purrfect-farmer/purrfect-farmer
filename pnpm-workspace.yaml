packages:
  - apps/*
  - packages/*

allowBuilds:
  bufferutil: true
  es5-ext: true
  protobufjs: true
  sharp: true
  sqlite3: true
  utf-8-validate: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - bufferutil
  - es5-ext
  - esbuild
  - protobufjs
  - sharp
  - sqlite3
  - utf-8-validate

# Patched floors for transitive deps flagged by Dependabot, kept within each major
overrides:
  fast-uri@>=3 <3.1.9: ^3.1.9
  browserslist@<4.29.4: ^4.29.4
  baseline-browser-mapping@<2.11.0: ^2.11.0
  # Pinned until 8.3.5 clears the release-age gate, a peer resolves to the newest otherwise
  vite@8: 8.3.4
  valibot@>=1.0.0 <1.4.2: ^1.5.0
  pbkdf2@<3.1.7: ^3.1.7
  sqlite3@5: ^6.0.1
